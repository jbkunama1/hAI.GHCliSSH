services:
  copilot-terminal:
    image: ghcr.io/jbkunama1/hai.ghclissh:main
    container_name: hAI.GHCliSSH
    environment:
      # MCP Server configuration
      MCP_SERVER: ${MCP_SERVER:-AnythingMCP}
      # LLM Provider API Key
      LLM_PROVIDER_API_KEY: ${LLM_PROVIDER_API_KEY:-}
      # Copilot CLI reads COPILOT_GITHUB_TOKEN automatically (fine-grained PAT with "Copilot Requests" scope)
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}
      # ttyd Basic-Auth: leave TTYD_PASSWORD empty to disable login prompt
      TTYD_USER: ${TTYD_USER:-admin}
      TTYD_PASSWORD: ${TTYD_PASSWORD:-}
    ports:
      - "8833:8833"
    volumes:
      - copilot-config:/home/copilot/.copilot
    networks:
      - highfishNetwork
    restart: unless-stopped

volumes:
  copilot-config:

networks:
  highfishNetwork:
    external: true
